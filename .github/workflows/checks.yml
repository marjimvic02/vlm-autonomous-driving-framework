name: Source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-and-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_source.py
      - run: python -m flake8 scripts tests carla_client_script ros_ws/src/perception_module ros_ws/src/decision_making_module ros_ws/src/low_control_module/low_control_module ros_ws/src/low_control_module/launch ros_ws/src/low_control_module/setup.py
      - run: python -m black --check --workers 1 scripts tests carla_client_script ros_ws/src/perception_module ros_ws/src/decision_making_module ros_ws/src/low_control_module/low_control_module ros_ws/src/low_control_module/launch ros_ws/src/low_control_module/setup.py
